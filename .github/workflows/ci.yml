name: VirtualAP CI

# Every push and pull request builds the static binaries and the APK and
# uploads the APK as an artifact. A v* tag, or a manual run with tag_name,
# also publishes it as a GitHub release. The APK is signed with the release
# key when the RELEASE_KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD
# secrets are set, and with a throwaway key when they are not (a fork, a pull
# request).
on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Publish a release for this tag (existing or new, must match VERSION)"
        required: false
        type: string

permissions:
  # Needed to create the release on a tag; a pull request token is read-only regardless
  contents: write

jobs:
  binaries:
    name: Static binaries (${{ matrix.arch }})
    # ARM runners run both the arm64 and the 32-bit arm Alpine containers
    # natively, so nothing is compiled under emulation.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        arch: [aarch64, armhf]
    steps:
    - uses: actions/checkout@v5

    # The binaries only depend on the three source submodules and the build
    # scripts, so most pushes can reuse the previous build.
    - name: Hash the sources
      id: src
      run: echo "hash=$(git ls-tree HEAD externals scripts | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Restore cached binaries
      id: cache
      uses: actions/cache@v4
      with:
        path: backend/${{ matrix.arch }}
        key: bin-${{ matrix.arch }}-${{ steps.src.outputs.hash }}

    - name: Build static binaries from source
      if: steps.cache.outputs.cache-hit != 'true'
      # Compiles hostapd/iw/dnsmasq (+ busybox) in an Alpine container from the
      # externals/ submodules and stages them into backend/<arch>.
      run: bash scripts/build-static.sh ${{ matrix.arch }}

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.arch }}
        path: backend/${{ matrix.arch }}
        if-no-files-found: error

  build:
    name: Build Android App
    needs: [binaries]
    runs-on: ubuntu-latest
    env:
      # The tag being released, if any
      TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
    - uses: actions/checkout@v5
      with:
        # The changelog walks back to the previous tag
        fetch-depth: 0

    # One version, the VERSION file. A tag must match it, so a forgotten bump
    # fails here instead of shipping.
    - name: Settle the version
      run: |
        VERSION=$(tr -d '[:space:]' < VERSION)
        if [ -n "$TAG" ]; then
          [ "${TAG#v}" = "$VERSION" ] || { echo "Tag $TAG does not match VERSION $VERSION (bump VERSION first)"; exit 1; }
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    # Each artifact unpacks into backend/<its name>. The APK carries no file
    # modes, so the lost executable bit does not matter; the installer sets it.
    - name: Download the binaries
      uses: actions/download-artifact@v4
      with:
        pattern: '{aarch64,armhf}'
        path: backend

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # The key lives in a secret as base64; without it the APK is signed with a throwaway key
    - name: Decode Keystore
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      if: github.event_name != 'pull_request' && env.RELEASE_KEYSTORE != ''
      run: echo "$RELEASE_KEYSTORE" | base64 -d > virtualap.keystore

    # A release signed with a throwaway key could never update the real app, so
    # a release run without the key stops here instead of publishing one
    - name: Require the key for a release
      if: env.TAG != ''
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        [ -n "$RELEASE_KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "Releases are signed with the release key: set RELEASE_KEYSTORE and KEYSTORE_PASSWORD"; exit 1; }

    # A pull request builds unsigned, so its run never sees the passwords.
    - name: Build Android App with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
        KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KEY_ALIAS || '' }}
        KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEY_PASSWORD || '' }}
      run: |
        cd Android
        ./gradlew assembleRelease --no-daemon \
          -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
          -PKEY_ALIAS="$KEY_ALIAS" \
          -PKEY_PASSWORD="$KEY_PASSWORD"

    # Every build, release or not, is named <version>-<commit> so the exact
    # source an APK came from is legible from its filename
    - name: Stage & Rename Artifact
      run: |
        HASH=$(git log -1 --pretty=%h)
        APK_NAME="VirtualAP-v${VERSION}-${HASH}.apk"
        mkdir -p dist
        mv Android/app/build/outputs/apk/release/app-release.apk dist/${APK_NAME}
        (cd dist && sha256sum ${APK_NAME} > SHA256SUMS)

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: virtualap-apk
        path: dist/
        if-no-files-found: error
        retention-days: 14

    # Every commit since the previous tag, pull requests included. On a tag
    # push HEAD is the tag, so the previous one is found from its parent; a
    # manual run for a tag not made yet ends at HEAD
    - name: Generate Changelog
      if: env.TAG != ''
      run: |
        END=HEAD
        git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null && END="${TAG}"
        PREV=$(git describe --tags --abbrev=0 "${END}^" 2>/dev/null || true)
        echo "Previous tag: ${PREV:-none}"
        {
          echo "## What's Changed"
          git log --no-merges --pretty=format:"* %s (%h)" ${PREV:+${PREV}..}${END}
          echo
          echo
          echo "---"
          echo "**Automated Release by VirtualAP CI**"
        } > dist/CHANGELOG.md

    - name: Publish GitHub Release
      if: env.TAG != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: VirtualAP ${{ env.TAG }}
        target_commitish: ${{ github.sha }}
        files: |
          dist/*.apk
          dist/SHA256SUMS
        body_path: dist/CHANGELOG.md
